<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假压力计算器（按表5-1）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); color: #333; line-height: 1.6; padding: 20px; min-height: 100vh; }
        .container { width: min(1800px, 98vw); margin: 0 auto; background-color: rgba(255,255,255,0.96); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.3); overflow: hidden; }
        header { background: linear-gradient(to right, #2c3e50, #4a6491); color: white; padding: 25px; text-align: center; }
        h1 { font-size: clamp(1.8rem,5vw,2.5rem); margin-bottom: 8px; }
        .subtitle { font-size: clamp(1rem,3vw,1.15rem); opacity: .92; }
        .content { display: flex; flex-wrap: nowrap; align-items: flex-start; padding: 20px; gap: 20px; }
        .input-section, .result-section { background: #f8f9fa; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,.1); padding: 20px; }
        .input-section { flex: 0 0 360px; min-width: 360px; }
        .result-section { flex: 1 1 auto; min-width: 0; }
        h2 { color: #2c3e50; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #3498db; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        input, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,.5); }
        button { background: linear-gradient(to right, #3498db, #2c3e50); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        button:hover { transform: translateY(-1px); }
        .result-table { background: #fff; border-radius: 10px; overflow: auto; box-shadow: 0 4px 8px rgba(0,0,0,.08); margin-top: 20px; max-height: 70vh; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 980px; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; background: inherit; }
        thead th:first-child { z-index: 3; background: #27ae60; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #ddd; white-space: nowrap; font-size: 14px; }
        thead th { background: #27ae60; color: #fff; position: sticky; top: 0; z-index: 1; }
        tbody tr:nth-child(even) { background: #fafafa; }
        .note { margin-top: 14px; background: #eef7ff; border-left: 4px solid #3498db; padding: 12px 14px; border-radius: 6px; font-size: .95rem; }
        .chart-container { width: 100%; height: 420px; margin-top: 24px; background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,.08); }
        #pressureCanvas { width: 100%; height: 100%; }
        .query-section { background: #e3f2fd; padding: 18px; border-radius: 10px; margin-top: 24px; box-shadow: 0 4px 8px rgba(0,0,0,.08); }
        .query-form { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .query-form > div { flex: 1 1 220px; }
        .query-result { margin-top: 15px; padding: 14px; background: #fff; border-radius: 8px; text-align: center; font-size: 1.1rem; }
        .highlight, .query-value { color: #e74c3c; font-weight: bold; }
        footer { text-align: center; padding: 18px; background: #2c3e50; color: #fff; font-size: .92rem; }
        @media (max-width: 992px) { .content { flex-wrap: wrap; } .input-section { flex: 1 1 100%; min-width: 0; } .result-section { flex: 1 1 100%; min-width: 0; } }
        @media (max-width: 768px) { body { padding: 10px; } .content { padding: 12px; gap: 12px; } .chart-container { height: 320px; } .result-table { max-height: 55vh; } table { min-width: 980px; } th, td { font-size: 13px; padding: 8px 6px; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>假压力计算器</h1>
        <div class="subtitle">按图中表 5-1 的数值积分过程输出：f(p)、平均项、Δp、增量与累计假压力</div>
    </header>

    <div class="content">
        <div class="input-section">
            <h2>输入参数</h2>
            <div class="form-group">
                <label for="pressure">压力 p (MPa)</label>
                <input type="text" id="pressure" value="2.76 5.52 8.28 11.04 13.8 16.56 19.32 22.08 24.84 27.6 30.36">
            </div>
            <div class="form-group">
                <label for="viscosity">气体粘度 μg (mPa·s)</label>
                <input type="text" id="viscosity" value="0.01286 0.01390 0.01530 0.01680 0.01840 0.02010 0.02170 0.02340 0.02500 0.02660 0.02831">
            </div>
            <div class="form-group">
                <label for="zFactor">气体偏差因子 Z</label>
                <input type="text" id="zFactor" value="0.937 0.882 0.832 0.794 0.770 0.763 0.775 0.797 0.827 0.860 0.896">
            </div>
<button id="calculateBtn">计算假压力</button>
                   </div>

        <div class="result-section">
            <h2>计算结果</h2>
            <div class="result-table">
                <table id="resultTable">
                    <thead>
                    <tr>
                        <th>序号</th>
                        <th>p (MPa)</th>
                        <th>μg (mPa·s)</th>
                        <th>Z</th>
                        <th>2p/(μgZ)*10^11（1/s）</th>
                        <th>2p平均/(μgZ)*10^11（1/s）</th>
                        <th>Δp (MPa)</th>
                        <th>2p平均/(μgZ)×Δp*10^11（MPa/s）</th>
                        <th>m(p) *10^11（MPa/s）</th>
                    </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>

            <div class="chart-container">
                <canvas id="pressureCanvas"></canvas>
            </div>

            <div class="query-section">
                <h2>假压力查询</h2>
                <div class="query-form">
                    <div><input type="number" id="queryPressure" placeholder="输入压力值 (MPa)" step="0.01"></div>
                    <div><button id="queryBtn">查询</button></div>
                </div>
                <div class="query-result"><div id="queryResult">查询结果将显示在这里</div></div>
            </div>
        </div>
    </div>

    <footer>输出方式已按图片中的数值积分表调整，默认示例数据可复现图中 m(p) 结果。</footer>
</div>

<script>
const canvas = document.getElementById('pressureCanvas');
const ctx = canvas.getContext('2d');
let calculationData = { pressure: [], m_p: [], rows: [] };

document.getElementById('calculateBtn').addEventListener('click', calculate);
document.getElementById('queryBtn').addEventListener('click', queryPressure);
window.addEventListener('load', () => { setCanvasSize(); calculate(); });
window.addEventListener('resize', setCanvasSize);

function setCanvasSize() {
    const container = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth;
    const h = container.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    drawChart();
}

function parseSeries(id, name) {
    const values = document.getElementById(id).value.trim().split(/\s+/).map(Number);
    if (!values.length || values.some(v => Number.isNaN(v))) {
        throw new Error(`${name} 存在空值或非数字`);
    }
    return values;
}

function calculate() {
    try {
        const p = parseSeries('pressure', '压力');
        const mu = parseSeries('viscosity', '粘度');
        const z = parseSeries('zFactor', 'Z 因子');
        const scaleFactor = 0.01;

        if (p.length !== mu.length || p.length !== z.length) throw new Error('三组数据长度必须一致');
        if (p.length < 1) throw new Error('至少需要一组数据');
                for (let i = 0; i < p.length; i++) {
            if (mu[i] <= 0 || z[i] <= 0) throw new Error(`第 ${i + 1} 行 μg 和 Z 必须大于 0`);
            if (i > 0 && p[i] <= p[i - 1]) throw new Error('压力必须按从小到大排列，才能按表格方式积分');
        }

        const rows = [];
        let cumulative = 0;
        for (let i = 0; i < p.length; i++) {
            const f = (2 * p[i]) / (mu[i] * z[i]) * scaleFactor;
            const avg = i === 0 ? f / 2 : (rows[i - 1].f + f) / 2;
            const deltaP = i === 0 ? p[i] : (p[i] - p[i - 1]);
            const increment = avg * deltaP;
            cumulative += increment;
            rows.push({
                index: i + 1,
                p: p[i],
                mu: mu[i],
                z: z[i],
                f,
                avg,
                deltaP,
                increment,
                m: cumulative
            });
        }

        calculationData = {
            pressure: rows.map(r => r.p),
            m_p: rows.map(r => r.m),
            rows
        };

        displayResults(rows);
        drawChart();
        document.getElementById('queryResult').textContent = '查询结果将显示在这里';
    } catch (err) {
        alert('计算失败：' + err.message);
    }
}

function displayResults(rows) {
    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';
    rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.index}</td>
            <td>${r.p.toFixed(2)}</td>
            <td>${r.mu.toFixed(5)}</td>
            <td>${r.z.toFixed(3)}</td>
            <td>${r.f.toFixed(3)}</td>
            <td>${r.avg.toFixed(3)}</td>
            <td>${r.deltaP.toFixed(2)}</td>
            <td>${r.increment.toFixed(3)}</td>
            <td><strong>${r.m.toFixed(3)}</strong></td>
        `;
        tbody.appendChild(tr);
    });
}

function drawChart() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (!calculationData.pressure.length) return;

    const margin = { top: 30, right: 30, bottom: 60, left: 80 };
    const chartW = w - margin.left - margin.right;
    const chartH = h - margin.top - margin.bottom;

    const xMin = Math.min(...calculationData.pressure);
    const xMax = Math.max(...calculationData.pressure);
    const yMin = 0;
    const yMax = Math.max(...calculationData.m_p) * 1.08;

    const xMap = x => margin.left + (x - xMin) / (xMax - xMin) * chartW;
    const yMap = y => h - margin.bottom - (y - yMin) / (yMax - yMin) * chartH;

    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    const grid = 6;
    for (let i = 0; i <= grid; i++) {
        const x = margin.left + chartW * i / grid;
        const y = margin.top + chartH * i / grid;
        ctx.beginPath(); ctx.moveTo(x, margin.top); ctx.lineTo(x, h - margin.bottom); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(w - margin.right, y); ctx.stroke();
    }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(margin.left, margin.top); ctx.lineTo(margin.left, h - margin.bottom); ctx.lineTo(w - margin.right, h - margin.bottom); ctx.stroke();

    ctx.fillStyle = '#000';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    for (let i = 0; i <= grid; i++) {
        const xVal = xMin + (xMax - xMin) * i / grid;
        const x = xMap(xVal);
        ctx.fillText(xVal.toFixed(1), x, h - margin.bottom + 18);
    }
    ctx.textAlign = 'right';
    for (let i = 0; i <= grid; i++) {
        const yVal = yMin + (yMax - yMin) * i / grid;
        const y = yMap(yVal);
        ctx.fillText(yVal.toFixed(0), margin.left - 8, y + 4);
    }

    ctx.textAlign = 'center';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('压力 p (MPa)', margin.left + chartW / 2, h - 18);
    ctx.save();
    ctx.translate(22, margin.top + chartH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('假压力 m(p)', 0, 0);
    ctx.restore();

    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    calculationData.pressure.forEach((x, i) => {
        const px = xMap(x), py = yMap(calculationData.m_p[i]);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();

    ctx.fillStyle = '#e74c3c';
    calculationData.pressure.forEach((x, i) => {
        const px = xMap(x), py = yMap(calculationData.m_p[i]);
        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
    });
}

function queryPressure() {
    const q = parseFloat(document.getElementById('queryPressure').value);
    if (!Number.isFinite(q)) return alert('请输入有效压力值');
    const x = calculationData.pressure;
    const y = calculationData.m_p;
    if (!x.length) return alert('请先计算');
    if (q < x[0] || q > x[x.length - 1]) return alert(`压力值必须在 ${x[0].toFixed(2)} 到 ${x[x.length - 1].toFixed(2)} MPa 之间`);

    if (q === x[0]) return showQuery(q, y[0]);
    if (q === x[x.length - 1]) return showQuery(q, y[y.length - 1]);

    let lower = 0;
    for (let i = 0; i < x.length - 1; i++) {
        if (x[i] <= q && q <= x[i + 1]) { lower = i; break; }
    }
    const ratio = (q - x[lower]) / (x[lower + 1] - x[lower]);
    const mq = y[lower] + (y[lower + 1] - y[lower]) * ratio;
    showQuery(q, mq);
}

function showQuery(q, m) {
    document.getElementById('queryResult').innerHTML = `压力 <span class="highlight">${q.toFixed(2)} MPa</span> 对应的假压力为 <span class="query-value">${m.toFixed(3)}</span>`;
}
</script>
</body>
</html>
